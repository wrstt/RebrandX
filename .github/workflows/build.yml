name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine tests
        run: python tests/test_engine.py

  windows-exe:
    name: RebrandX.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Build
        run: |
          python -m PyInstaller `
            --name RebrandX --onefile --windowed --noconfirm --clean `
            --icon share\rebrandx.ico `
            --add-data "rebrandx\ui;rebrandx/ui" `
            --hidden-import webview.platforms.edgechromium `
            --collect-all webview `
            rebrandx\app_win.py

      - name: Check it produced something runnable
        run: |
          if (-not (Test-Path dist\RebrandX.exe)) { throw "RebrandX.exe was not produced" }
          $size = (Get-Item dist\RebrandX.exe).Length
          Write-Host "RebrandX.exe is $([math]::Round($size/1MB,1)) MB"
          if ($size -lt 3MB) { throw "RebrandX.exe looks too small to be complete" }

      - uses: actions/upload-artifact@v4
        with:
          name: RebrandX-windows
          path: dist/RebrandX.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RebrandX.exe

  deb:
    name: rebrandx.deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RebrandX-deb
          path: dist/*.deb
          if-no-files-found: error
