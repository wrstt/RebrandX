name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.9', '3.12']
        include:
          # An older Windows image too, so the Win32 calls in win.py are
          # exercised somewhere other than the newest build of Windows.
          - os: windows-2022
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Engine tests
        run: python tests/test_engine.py

      - name: Windows behaviour tests
        # The window is built for real in here, so the runner needs a
        # display. Windows runners have one; the Linux ones need Xvfb.
        run: python tests/test_windows.py
        if: runner.os == 'Windows'

      - name: Windows behaviour tests (Linux, headless)
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/test_windows.py

      # The CLI has to survive being redirected into a file on a machine
      # whose console codepage is not UTF-8 -- that used to raise
      # UnicodeEncodeError and take the whole run with it.
      - name: CLI on a legacy codepage (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set PYTHONIOENCODING=cp1252
          python rebrandx\cli.py --help > cli-help.log 2>&1 || exit /b 1
          mkdir demo\src
          echo taskly> demo\src\taskly.txt
          python rebrandx\cli.py Taskly Flowdesk demo -n -v > cli-dry.log 2>&1 || exit /b 1
          type cli-dry.log

      - name: CLI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p demo/src && echo taskly > demo/src/taskly.txt
          python rebrandx/cli.py --help > /dev/null
          python rebrandx/cli.py Taskly Flowdesk demo -n -v

      # The whole point of the native window: nothing to install. Asserted
      # by importing the app and checking what it actually pulled in --
      # the runner image ships pipx and friends, so an empty `pip freeze`
      # was never the right question.
      - name: The app imports using only the standard library
        # sys.stdlib_module_names arrived in 3.10, and the answer does not
        # vary by interpreter version anyway -- asking once per OS is enough.
        if: matrix.python == '3.12'
        shell: python
        run: |
          import sys
          # `shell: python` runs from a temp file, so the checkout is on the
          # working directory rather than on sys.path.
          sys.path.insert(0, ".")
          import rebrandx.app_tk  # noqa: F401

          allowed = set(sys.stdlib_module_names) | {"rebrandx"}
          extra = sorted({
              name.split(".")[0] for name in sys.modules
              if not name.startswith("_")
              and name.split(".")[0] not in allowed
          })
          if extra:
              sys.exit("third-party imports reached: %s" % ", ".join(extra))
          print("stdlib only: %d modules, no third-party imports"
                % len(sys.modules))

  windows-exe:
    name: RebrandX.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File windows\build.ps1

      - name: Check the frozen CLI actually runs
        shell: cmd
        run: |
          dist\windows\rbx.exe --help > nul || exit /b 1
          mkdir frozen\src
          echo taskly> frozen\src\taskly.txt
          dist\windows\rbx.exe Taskly Flowdesk frozen -y || exit /b 1
          if not exist frozen\src\flowdesk.txt exit /b 1
          echo frozen CLI rebranded the fixture correctly

      # `rbx` with no arguments opens the window, and a double-click is that
      # same route -- so the binary has to carry tkinter and the app, not
      # just the engine. --self-test asks it, rather than finding out in
      # front of whoever downloaded the release.
      - name: The frozen build can still open the window
        shell: cmd
        run: |
          dist\windows\rbx.exe --self-test || exit /b 1

      # Portable means portable: copy the .exe somewhere else entirely, run
      # it from there, and check it left nothing on the machine behind it.
      # There is no installer, so nothing may quietly install itself either.
      - name: The .exe is portable
        shell: pwsh
        run: |
          $away = Join-Path $env:TEMP "elsewhere\tools"
          $demo = Join-Path $env:TEMP "elsewhere\demo"
          New-Item -ItemType Directory -Force $away, "$demo\src" | Out-Null
          Copy-Item dist\windows\rbx.exe $away
          Set-Content "$demo\src\taskly.txt" "taskly"
          & "$away\rbx.exe" Taskly Flowdesk $demo -y
          if ($LASTEXITCODE -ne 0) { throw "the copied .exe failed to run" }
          if (-not (Test-Path "$demo\src\flowdesk.txt")) { throw "it did not rebrand the fixture" }
          foreach ($key in @("HKCU:\Software\Classes\Directory\shell\RebrandX",
                             "HKCU:\Software\Classes\Directory\Background\shell\RebrandX",
                             "HKCU:\Software\RebrandX")) {
            if (Test-Path $key) { throw "the .exe registered $key -- it is meant to be portable" }
          }
          if (Test-Path "$env:LOCALAPPDATA\RebrandX") { throw "the .exe installed itself into LOCALAPPDATA" }
          Write-Host "ran from $away and left the machine alone"

      - uses: actions/upload-artifact@v4
        with:
          name: RebrandX-windows
          path: |
            dist/windows/RebrandX.exe
            dist/windows/rbx.exe
            dist/windows/RebrandX-windows.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/RebrandX.exe
            dist/windows/rbx.exe
            dist/windows/RebrandX-windows.zip

  deb:
    name: rebrandx.deb
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        run: ./linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RebrandX-deb
          path: dist/linux/*.deb
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/linux/*.deb
